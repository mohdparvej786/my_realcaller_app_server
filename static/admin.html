<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealCaller Admin</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #fff;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

h1 {
    margin: 0;
    font-size: 28px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.card h3 {
    margin: 0;
    font-size: 16px;
    color: #94a3b8;
}

.value {
    font-size: 24px;
    margin-top: 10px;
    font-weight: bold;
}

.section {
    margin-top: 30px;
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
    background: #0f172a;
    color: #fff;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    cursor: pointer;
    margin-right: 10px;
}

button:hover {
    background: #4f46e5;
}

pre {
    background: #020617;
    padding: 15px;
    border-radius: 10px;
    overflow-x: auto;
}

.upload-box {
    border: 2px dashed #334155;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
}

.success {
    color: #22c55e;
}

</style>
</head>

<body>

<div class="container">

<header>
    <h1>🚀 RealCaller Admin Dashboard</h1>
    <p>Control Panel & Analytics</p>
</header>

<!-- STATS -->
<div class="stats">
    <div class="card">
        <h3>Total Contacts</h3>
        <div class="value" id="contacts">--</div>
    </div>

    <div class="card">
        <h3>Spam Reports</h3>
        <div class="value" id="spam">--</div>
    </div>

    <div class="card">
        <h3>Server</h3>
        <div class="value success">Running</div>
    </div>

    <div class="card">
        <h3>Redis</h3>
        <div class="value" id="redis">--</div>
    </div>
</div>

<!-- SEARCH -->
<div class="section">
    <h3>🔍 Search Number</h3>
    <input type="text" id="number" placeholder="Enter mobile number">
    <button onclick="search()">Search</button>

    <pre id="result">Result will appear here...</pre>
</div>

<!-- UPLOAD -->
<div class="section">
    <h3>📤 Upload Contacts JSON</h3>

    <div class="upload-box">
        <input type="file" id="file">
        <br><br>
        <button onclick="upload()">Upload</button>
    </div>

    <p id="uploadStatus"></p>
</div>

</div>

<script>
function search() {
    let number = document.getElementById("number").value;

    fetch(`/admin/search?number=${number}`)
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText =
            JSON.stringify(data, null, 2);
    });
}

function upload() {
    let file = document.getElementById("file").files[0];

    let formData = new FormData();
    formData.append("file", file);

    fetch("/admin/upload", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("uploadStatus").innerText =
            "✅ Uploaded: " + data.uploaded;
    });
}

// OPTIONAL: LOAD STATS (dummy)
function loadStats() {
    document.getElementById("contacts").innerText = "Live";
    document.getElementById("spam").innerText = "Live";
    document.getElementById("redis").innerText = "Connected";
}

loadStats();
</script>

</body>
</html>
